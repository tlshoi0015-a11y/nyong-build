name: Build EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyautogui keyboard numpy mss opencv-python pywin32 pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --console nyong.py

    - name: Upload EXE
      uses: actions/upload-artifact@v3
      with:
        name: nyong-exe
        path: dist/nyong.exe
